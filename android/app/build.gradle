plugins {
    id 'com.android.application'
}

android {
    namespace 'ec.vialidad.app'
    compileSdk 34

    defaultConfig {
        applicationId "ec.vialidad.app"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Sin dependencias externas: solo el framework de Android.
