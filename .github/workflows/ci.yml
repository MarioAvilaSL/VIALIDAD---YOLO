name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vialidad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vialidad_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # OpenCV necesita estas bibliotecas del sistema en Linux
      - name: Bibliotecas del sistema
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      # PyTorch solo CPU: evita descargar CUDA
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Las pruebas usan un detector simulado: no hace falta models/best.pt
      - name: Pruebas
        run: pytest -q
